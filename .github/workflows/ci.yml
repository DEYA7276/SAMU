name: SAMU UTGZ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend (Laravel API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath

      - name: Copiar .env de prueba
        run: cp backend/.env.example backend/.env

      - name: Instalar dependencias Composer
        run: |
          cd backend
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generar App Key
        run: |
          cd backend
          php artisan key:generate

  frontend-checks:
    name: Frontend (Ionic + Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias NPM
        run: |
          cd frontend
          npm ci

      - name: Compilar Frontend (Build check)
        run: |
          cd frontend
          npm run build --if-present
